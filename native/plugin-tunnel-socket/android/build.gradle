/*
 * Gradle module for the Capacitor tunnel-socket plugin.
 *
 * `android/capacitor.settings.gradle` includes this directory as
 * `:chatterang-plugin-tunnel-socket`, so this file is what compiles the
 * Kotlin in `src/main/java`. Unlike `plugin-llama-cpp`, there is no JNI and no
 * vendored C++ library to fetch — OkHttp and okio, both pure JVM, are the only
 * dependency this plugin adds.
 *
 * WHY EVERYTHING LIVES HERE AND NOT IN `android/app`: the whole `/android`
 * tree is generated by `npx cap add android` and is gitignored. An edit there
 * survives neither a fresh clone nor a `cap sync`. This module is tracked, so
 * this is the only place a build change can actually persist.
 *
 * The Kotlin plugin is applied through this module's OWN `buildscript` block
 * rather than the generated root `android/build.gradle`, for the same reason
 * — mirrors `plugin-llama-cpp/android/build.gradle`.
 */

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.13 (what Capacitor 8 generates) pairs with Kotlin 2.1.x.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "app.chatterang.tunnelsocket"
    compileSdk = rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36

    defaultConfig {
        minSdkVersion rootProject.ext.has('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    // The ~800 KB #181's ruling and #295 both cost against Android: OkHttp for
    // the WebSocket client, okio as its own transitive dependency (declared
    // explicitly here rather than left implicit, since this file uses its
    // `ByteString` directly).
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okio:okio:3.9.0'
}
