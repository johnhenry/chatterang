/*
 * Gradle module for the Capacitor llama.cpp plugin.
 *
 * `android/capacitor.settings.gradle` includes this directory as
 * `:chatterang-plugin-llama-cpp`, so this file is what compiles the Kotlin in
 * `src/main/java` and (later) the JNI in `src/main/cpp`.
 *
 * WHY EVERYTHING LIVES HERE AND NOT IN `android/app`: the whole `/android`
 * tree is generated by `npx cap add android` and is gitignored. An edit there
 * survives neither a fresh clone nor a `cap sync`. This module is tracked, so
 * this is the only place a build change can actually persist.
 *
 * The Kotlin plugin is applied through this module's OWN `buildscript` block
 * rather than the generated root `android/build.gradle`, for the same reason.
 */

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.13 (what Capacitor 8 generates) pairs with Kotlin 2.1.x.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

/*
 * llama.cpp is neither vendored nor submoduled. `tools/fetch-llama-cpp.sh`
 * clones the pinned tag into a gitignored `.cache/` directory shared with the
 * iOS build, and its path is handed to CMake.
 *
 * The pin lives in the script, and is read from it rather than repeated here:
 * two copies of a version number drift, and the failure that produces is a
 * link error against the wrong `llama.h` much later.
 */
def fetchScript = file("${projectDir}/../tools/fetch-llama-cpp.sh")
def llamaCppTag = (fetchScript.text =~ /LLAMA_TAG="([^"]+)"/)[0][1]
def llamaCppDir = file("${projectDir}/../../../.cache/llama.cpp-${llamaCppTag}")

if (!llamaCppDir.exists()) {
    // Refuse rather than guess, and name the one command that fixes it.
    throw new GradleException(
        "llama.cpp ${llamaCppTag} is not in the cache at ${llamaCppDir}.\n" +
        "Run: ./native/plugin-llama-cpp/tools/fetch-llama-cpp.sh")
}

android {
    namespace = "app.chatterang.llama"
    compileSdk = rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36

    ndkVersion = "27.1.12297006"

    defaultConfig {
        minSdkVersion rootProject.ext.has('minSdkVersion') ? rootProject.ext.minSdkVersion : 24

        /*
         * Keep rules for the JNI's runtime name lookups, shipped INSIDE this
         * module so R8 merges them into whatever app consumes it. Same
         * mechanism `@capacitor/android` uses for its own reflective plugin
         * discovery (capacitor/build.gradle:50), and the only placement that
         * survives `cap sync` — `android/app/proguard-rules.pro` is in the
         * generated, gitignored tree. `proguard-rules.pro` says what breaks
         * without it.
         */
        consumerProguardFiles 'proguard-rules.pro'

        externalNativeBuild {
            cmake {
                arguments "-DLLAMA_CPP_DIR=${llamaCppDir}",
                          "-DCHATTERANG_LLAMA_TAG=${llamaCppTag}",
                          "-DANDROID_STL=c++_shared"
                cppFlags "-O3", "-fexceptions", "-frtti"
            }
        }

        // arm64-v8a alone. It is what every Android device this app targets
        // runs and what the API-36 emulator on an Apple-silicon Mac runs, and
        // each extra ABI is another full llama.cpp compile — armeabi-v7a in
        // particular is 32-bit, where a 6 GB mmap of a GGUF cannot fit in the
        // address space at all. Adding one is a line here, not a redesign.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
}
